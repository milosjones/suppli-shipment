name: supli-shipment

x-backend: &backend
  build: ./backend
  environment: &backend-env
    APP_NAME: "Suppli Shipments"
    APP_ENV: local
    APP_KEY: ${APP_KEY:-base64:AfsHeBYjLDJZ4+sKwqwO0ajS3ciFBp3/iIFIa4deWFw=}
    APP_DEBUG: "true"
    APP_URL: http://localhost:8080
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: shipments
    DB_USERNAME: shipments
    DB_PASSWORD: shipments
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    TRACKING_PROVIDERS: fake
  volumes:
    - import-files:/var/www/html/storage/app/private/imports
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: shipments
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: shipments
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shipments -d shipments"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *backend
    environment:
      <<: *backend-env
      SEED_ON_START: "true"

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--sleep=1"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  import-files:
