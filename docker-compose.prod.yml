name: suppli-shipment

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipments
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shipments -d shipments"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      SERVER_NAME: ${SERVER_NAME:-:80}
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: shipments
      DB_USERNAME: shipments
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - import-files:/app/storage/app/private/imports
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  import-files:
